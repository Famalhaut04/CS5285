<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CS5285 · 课程资料</title>
<style>:root{color-scheme:light dark;--bg:#f5f7fa;--card:#fff;--ink:#182333;--line:#dce3ec;--accent:#174b9a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:40px 22px}h1{font-size:40px;margin:0}a{color:var(--accent)}header p{margin:8px 0}nav{display:flex;gap:18px;flex-wrap:wrap;margin:20px 0}.note{padding:15px 18px;border-left:4px solid var(--accent);background:var(--card);font-size:14px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin:25px 0 10px}label{font-size:14px}input,select{display:block;width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}.card{background:var(--card);padding:18px 22px;border:1px solid var(--line);border-radius:10px;margin:12px 0}.card h2{font-size:17px;margin:0 0 7px;overflow-wrap:anywhere}.meta{font-size:13px;color:#52627a}.pill{display:inline-block;border:1px solid var(--line);padding:1px 8px;border-radius:12px;margin-right:8px;font-size:12px}footer{margin-top:35px;font-size:13px}#count{font-size:14px}button{cursor:pointer;padding:10px;border:1px solid var(--line);border-radius:7px}@media(max-width:650px){.filters{grid-template-columns:1fr}main{padding-top:25px}h1{font-size:32px}}@media(prefers-color-scheme:dark){:root{--bg:#111923;--card:#192433;--ink:#edf1f7;--line:#33445a;--accent:#a3c5ff}.meta{color:#b4c0d1}}</style></head>
<body><main><header><h1>CS5285 课程资料</h1><p>CityU · Semester A 2026/27 · Famalhaut04</p><p>按主题查课件、按周找练习。为本学期学习及后续同学参考整理。</p></header>
<nav><a href="https://github.com/Famalhaut04/CS5285">GitHub 仓库</a><a href="https://github.com/Famalhaut04/CS5285/blob/main/weeks/README.md">每周索引</a><a href="https://github.com/Famalhaut04/CS5285/blob/main/CATALOG.md">完整目录</a><a href="https://github.com/Famalhaut04/CS5285/blob/main/references/README.md">历年题参考</a><a href="https://github.com/Famalhaut04/CS5285/blob/main/NOTICE.md">来源说明</a></nav>
<div class="note">Assignment = 计分作业；Tutorial / Exercise = 课堂练习。教师答案单独标记。周次区分授课周和截止周，未确认的资料按主题收录。不同学年的范围与要求可能变化。</div>
<div class="filters"><label>搜索文件或知识主题<input id="search" type="search" placeholder="例如 RSA、ex04、Lecture 3、PS1"></label><label>资料分类<select id="category"><option value="">全部分类</option></select></label><label>周次<select id="week"><option value="">全部周次</option><option value="unknown">未明确周次</option></select></label></div>
<p id="count" role="status" aria-live="polite">正在读取资料目录…</p><section id="list" aria-label="资料列表"></section><noscript>请使用<a href="https://github.com/Famalhaut04/CS5285/blob/main/CATALOG.md">完整资料目录</a>。</noscript><footer id="coverage"></footer></main>
<script>
const $=id=>document.getElementById(id);let items=[];
function addOption(el,value,label){const o=document.createElement('option');o.value=value;o.textContent=label;el.appendChild(o)}
function render(){const q=$('search').value.toLowerCase().trim(),c=$('category').value,w=$('week').value;const rows=items.filter(r=>(!q||(r.title+' '+r.path+' '+r.category+' '+(r.keywords||'')).toLowerCase().includes(q))&&(!c||r.category===c)&&(!w||(w==='unknown'?r.weeks.length===0:r.weeks.includes(Number(w)))));$('count').textContent=`找到 ${rows.length} / ${items.length} 项资料`;$('list').replaceChildren();for(const r of rows){const card=document.createElement('article');card.className='card';const title=document.createElement('h2'),a=document.createElement('a');a.href=r.path.endsWith('.md')?'https://github.com/Famalhaut04/CS5285/blob/main/'+r.url:r.url;a.textContent=r.title;title.appendChild(a);card.appendChild(title);const tags=document.createElement('div');for(const t of [r.category,r.weeks.length?r.weeks.map(w=>'Week '+w).join(' / '):'周次未明确']){const s=document.createElement('span');s.className='pill';s.textContent=t;tags.appendChild(s)}card.appendChild(tags);const meta=document.createElement('div');meta.className='meta';meta.textContent=r.week_basis;card.appendChild(meta);const src=document.createElement('a');src.href=r.source_urls[0];src.textContent='Canvas 来源（需课程权限）';src.className='meta';card.appendChild(src);$('list').appendChild(card)}if(!rows.length){const p=document.createElement('p');p.textContent='没有匹配资料，请更换关键词或筛选条件。';$('list').appendChild(p)}}
for(const id of ['search','category','week'])$(id).addEventListener('input',render);
fetch('materials.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{items=data.items;for(const c of [...new Set(items.map(r=>r.category))].sort())addOption($('category'),c,c);for(let w=1;w<=13;w++)addOption($('week'),String(w),'Week '+String(w).padStart(2,'0'));$('coverage').textContent='更新：'+data.updated+'。'+data.coverage;render()}).catch(()=>{$('count').textContent='目录暂时无法读取，请通过顶部“完整目录”查阅资料。'});
</script></body></html>
